name: Husk IPA

# Builds Husk with this fork's changes and publishes it for Feather, AltStore and SideStore, in two sources made from the same
# releases: the public one (source.json), with main's builds from the first that plays Idling to Rule the Gods well, each
# described by its "What's new"; and the test channel (test-source.json), where every build of every branch is one tap away
# and says what it is. A commit's "Changelog: <plain text>" lines are its What's new.
#
# Husk's own native parts (QEMU, ANGLE, MoltenVK, the PS4 layer, the Java runtime) take hours and a Mac with the Android
# images to build; they are taken as they are from the official release this fork is based on (HUSK_RUNTIME), and only the
# app itself (Swift, the translation layer's C, the extensions) is compiled from the branch. Each run publishes a release
# tagged fork-<HUSK_RUNTIME>-<run> with Husk.ipa and its debug symbols (Husk.app.dSYM.zip), with notes naming the branch,
# the commit and the changes since the build before, then rewrites the source (source.json on the release tagged "feed"),
# whose address never changes:
#
#   https://github.com/La2o/husk/releases/download/feed/source.json        (public)
#   https://github.com/La2o/husk/releases/download/feed/test-source.json   (test channel)
#
# A push to any branch that has this file builds (builds of branches other than MAIN_LINE are marked as tests); so does
# "Run workflow" on the Actions tab, for any branch, with a note of what to test.

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'scripts/build_rppairing_ios.sh'
      - 'scripts/update_fork_source.py'
      - '.github/workflows/husk-ipa.yml'
  workflow_dispatch:
    inputs:
      notes:
        description: What to test in this build (shown in Feather)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: husk-ipa
  cancel-in-progress: false

env:
  # The official release whose native libraries and Java runtime go into the IPA: the release this branch's source is.
  HUSK_RUNTIME: '3.4'
  # Its build number: this fork's builds are numbered after it (149.<run>), so an installed 3.4 is always older.
  HUSK_RUNTIME_BUILD: '149'
  # The branch whose builds are the regular ones; any other branch's are marked as tests.
  MAIN_LINE: main

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the changes since the build before, for the notes

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          command -v xcodegen || brew install xcodegen

      - name: Official Husk ${{ env.HUSK_RUNTIME }} runtime
        run: |
          set -euo pipefail
          mkdir -p upstream/unpacked
          curl -fL --retry 3 --retry-delay 5 "https://github.com/Leviidev/Husk/releases/download/$HUSK_RUNTIME/Husk.ipa" -o upstream/Husk.ipa
          unzip -q upstream/Husk.ipa -d upstream/unpacked
          APP=upstream/unpacked/Payload/Husk.app
          for f in Husk Frameworks/libqemu-aarch64-softmmu.dylib Frameworks/libANGLE-shared.dylib Frameworks/libhuskps4.dylib \
                   java-runtime/husk-framework.dex java-runtime/husk-framework-core.dex; do
            test -e "$APP/$f" || { echo "the $HUSK_RUNTIME release has no $f"; exit 1; }
          done
          # what the project links and embeds, where it looks for it
          mkdir -p build/ios-arm64/lib build/ios-arm64/sysroot/lib
          cp "$APP/Frameworks/libqemu-aarch64-softmmu.dylib" "$APP/Frameworks/libhuskps4.dylib" build/ios-arm64/lib/
          cp "$APP/Frameworks/libANGLE-shared.dylib" build/ios-arm64/sysroot/lib/

      - name: On-device pairing library
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-ios
          ./scripts/build_rppairing_ios.sh
          test -f build/ios-arm64/lib/libhusk_rppairing.a

      - name: Project for the app only
        run: |
          set -euo pipefail
          # MoltenVK and the staged guest/runtime files come from the official IPA (above), not from a local build.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/app/project.yml")
          s = p.read_text()
          dep = "      - framework: ../../build/ios-arm64/lib/MoltenVK.xcframework\n        embed: true\n        codeSign: true\n        link: false\n"
          assert s.count(dep) == 1, "the MoltenVK dependency changed"
          s = s.replace(dep, "")
          a = s.index("    preBuildScripts:\n")
          b = s.index("    postBuildScripts:\n", a)
          p.write_text(s[:a] + s[b:])
          PY
          (cd src/app && xcodegen generate --quiet)

      - name: Compile
        run: |
          set -euo pipefail
          mkdir -p build/ci
          if ! xcodebuild -project src/app/Husk.xcodeproj -scheme Husk -sdk iphoneos -configuration Release \
               -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
               build > build/ci/xcodebuild.log 2>&1; then
            grep -nE 'error:|fatal error:|BUILD FAILED' build/ci/xcodebuild.log | tail -60 || true
            tail -40 build/ci/xcodebuild.log
            exit 1
          fi
          grep -cE ' warning: ' build/ci/xcodebuild.log || true
          test -f "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Husk.app/Husk"

      - name: Assemble the IPA
        id: ipa
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/upstream/unpacked/Payload/Husk.app"
          BUILT="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Husk.app"
          # this branch's executable and extensions in the official app (its resources are the same source's)
          cp "$BUILT/Husk" "$APP/Husk"
          for ext in "$BUILT"/PlugIns/*.appex; do
            [ -d "$ext" ] || continue
            rm -rf "$APP/PlugIns/$(basename "$ext")"
            cp -R "$ext" "$APP/PlugIns/"
          done
          RUN="$GITHUB_RUN_NUMBER"
          VERSION="$HUSK_RUNTIME.$RUN"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Info.plist"
          plutil -replace CFBundleVersion -string "$HUSK_RUNTIME_BUILD.$RUN" "$APP/Info.plist"
          plutil -replace HuskBuildCommit -string "$(git rev-parse --short HEAD)" "$APP/Info.plist"
          plutil -replace HuskBuildDate -string "$(date -u '+%Y-%m-%d %H:%M UTC')" "$APP/Info.plist"
          # ad hoc: Feather, AltStore and SideStore sign it again with the person's own certificate
          find "$APP" -name '*.dylib' -not -path '*/Frameworks/*.framework/*' -print0 | while IFS= read -r -d '' d; do
            codesign --force --sign - --timestamp=none "$d"
          done
          for fw in "$APP"/Frameworks/*.framework; do [ -d "$fw" ] && codesign --force --sign - --timestamp=none "$fw"; done
          for ext in "$APP"/PlugIns/*.appex; do [ -d "$ext" ] && codesign --force --sign - --timestamp=none "$ext"; done
          codesign --force --sign - --timestamp=none --entitlements src/app/Husk/Husk.entitlements "$APP"
          codesign --verify --strict "$APP"
          mkdir -p dist
          (cd upstream/unpacked && zip -qry "$GITHUB_WORKSPACE/dist/Husk.ipa" Payload)
          unzip -tq dist/Husk.ipa
          ls -lh dist/Husk.ipa
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Keep the IPA with the run
        uses: actions/upload-artifact@v4
        with:
          name: Husk-${{ steps.ipa.outputs.version }}
          path: dist/Husk.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Debug symbols
        run: |
          set -euo pipefail
          DSYM="$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Husk.app.dSYM"
          if [ -d "$DSYM" ]; then
            ditto -c -k --keepParent "$DSYM" dist/Husk.app.dSYM.zip
            dwarfdump --uuid "$DSYM" || true
          else
            echo "no dSYM was made"
          fi

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ipa.outputs.version }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          TAG="fork-$HUSK_RUNTIME-$GITHUB_RUN_NUMBER"
          BRANCH="$GITHUB_REF_NAME"
          # the build before: the newest fork release, and the commit it was made from
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '[.[] | select(.tag_name | startswith("fork-"))][0].tag_name // ""')
          PREV_SHA=""
          [ -n "$PREV_TAG" ] && PREV_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$PREV_TAG" --jq .sha 2>/dev/null || true)
          # What's new, for players: the "Changelog:" lines of the commits since the build before
          if [ -n "$PREV_SHA" ] && git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then RANGE="$PREV_SHA..HEAD"; else RANGE="-1"; fi
          WHATS_NEW=$(git log --no-merges --format=%B $RANGE | sed -n 's/^Changelog: *//p' | sed '/^[[:space:]]*$/d' | sed 's/^/- /')
          [ -n "$WHATS_NEW" ] || WHATS_NEW="- Fixes and improvements."
          {
            echo "## What's new"
            echo "$WHATS_NEW"
            echo "<!-- end of what's new -->"
            echo
            echo "**$VERSION** (build $HUSK_RUNTIME_BUILD.$GITHUB_RUN_NUMBER) from \`$BRANCH\` at \`${GITHUB_SHA::7}\`, on Husk $HUSK_RUNTIME."
            if [ "$BRANCH" != "$MAIN_LINE" ]; then echo; echo "Test build of the branch $BRANCH."; fi
            if [ -n "${NOTES:-}" ]; then echo; echo "What to test: $NOTES"; fi
            echo
            if [ -n "$PREV_SHA" ] && git merge-base --is-ancestor "$PREV_SHA" HEAD 2>/dev/null; then
              echo "Changes since $PREV_TAG (\`${PREV_SHA::7}\`):"
              git log -40 --no-merges --format='- %s (%h)' "$PREV_SHA..HEAD"
            else
              echo "Latest changes on $BRANCH:"
              git log --no-merges --format='- %s (%h)' -15
            fi
            echo
            echo "To look into a problem: the game's page > Technical Details > Share Log (Play Games calls are the lines starting 'gms: Play Games', servers the game looks up the ones starting 'net:'), and Online Saves > Copy Sign-In Details. Settings shows the commit a build is from. Husk.app.dSYM.zip symbolicates an iOS crash report (.ips) of this build."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          PRE=""
          [ "$BRANCH" != "$MAIN_LINE" ] && PRE="--prerelease"
          ASSETS=(dist/Husk.ipa)
          [ -f dist/Husk.app.dSYM.zip ] && ASSETS+=(dist/Husk.app.dSYM.zip)
          gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $PRE \
            --title "Husk $VERSION ($BRANCH)" --notes-file "$RUNNER_TEMP/notes.md"
          echo "IPA: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Husk.ipa"

      - name: Source for Feather / AltStore / SideStore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/feed/source.json"
          TEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/feed/test-source.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 scripts/update_fork_source.py "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/source.json" "$URL" "$HUSK_RUNTIME_BUILD"
          python3 scripts/update_fork_source.py "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/test-source.json" "$TEST_URL" "$HUSK_RUNTIME_BUILD" --all
          gh release view feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create feed --repo "$GITHUB_REPOSITORY" --title "Source for Feather, AltStore and SideStore" \
              --notes "Add this source: $URL" --latest=false
          gh release upload feed "$RUNNER_TEMP/source.json" "$RUNNER_TEMP/test-source.json" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Source: $URL"
          echo "Test channel: $TEST_URL"

      - name: Compiler log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: build/ci/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
